services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: marketplace-rabbitmq
    ports:
      - "5672:5672" # Porta usada para a mensageria (RabbitMQ AMQP)
      - "15672:15672" # Porta da interface web de gerenciamento (RabbitMQ Management)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:
